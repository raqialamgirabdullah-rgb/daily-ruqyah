name: Scrape MuslimBangla Hadith

on:
  workflow_dispatch:
    inputs:
      book_id:
        description: 'Book ID to scrape (e.g. 8, 12, 13, 16, 17)'
        required: true
        type: string

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run Scraper
        run: |
          node tools/scrape-muslimbangla.js ${{ inputs.book_id }}

      - name: Commit and push changes
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add data-src/muslimbangla/
          git commit -m "Auto-scrape book ${{ inputs.book_id }} from muslimbangla" || echo "No changes to commit"
          git push
