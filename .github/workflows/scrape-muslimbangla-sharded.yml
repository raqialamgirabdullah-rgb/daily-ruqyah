name: Scrape MuslimBangla Hadith (sharded)

on:
  workflow_dispatch:
    inputs:
      book_id:
        description: 'Book ID to scrape in 3 parallel shards (e.g. 17)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run scraper shard
        env:
          SHARD: ${{ matrix.shard }}/3
        run: node tools/scrape-muslimbangla.js ${{ inputs.book_id }} shard-out
      - uses: actions/upload-artifact@v4
        with:
          name: shard-${{ matrix.shard }}
          path: shard-out/*.json

  merge:
    needs: scrape
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/download-artifact@v4
        with:
          pattern: shard-*
          merge-multiple: true
          path: shard-out
      - name: Merge shards
        run: node tools/merge-shards.js ${{ inputs.book_id }} shard-out
      - name: Commit and push
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add data-src/muslimbangla/
          git commit -m "Auto-scrape book ${{ inputs.book_id }} from muslimbangla (3 shards)" || echo "No changes"
          git push
