name: Build Hadith Data

# data/hadith-chunks নতুন করে বানায়: ৯টি মূল কিতাব fawazahmed0/hadith-api থেকে,
# বাকি কিতাব data-src/muslimbangla/ থেকে (tools/build-hadith.js)।
# কমিটের আগে যাচাই করে যে পুরনো কিতাবগুলোর k/start/count/hasBn একটুও বদলায়নি।
on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fetch hadith-api editions (only the 9 books' ara/ben files)
        run: |
          git clone --depth 1 --filter=blob:none --sparse https://github.com/fawazahmed0/hadith-api hadith-api
          cd hadith-api
          git sparse-checkout init --no-cone
          PATTERNS=""
          for k in bukhari muslim abudawud tirmidhi nasai ibnmajah malik nawawi qudsi; do
            PATTERNS="$PATTERNS /editions/ara-$k.json /editions/ben-$k.json"
          done
          git sparse-checkout set --no-cone $PATTERNS
          ls editions | head -30
          git log -1 --format='source commit: %H %cd'

      - name: Snapshot current meta
        run: cp data/hadith-chunks/meta.json "$RUNNER_TEMP/old-meta.json"

      - name: Build data/hadith-chunks
        run: node tools/build-hadith.js hadith-api/editions

      - name: Verify old books are unchanged
        run: |
          node -e '
          const fs = require("fs");
          const o = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + "/old-meta.json", "utf8"));
          const n = JSON.parse(fs.readFileSync("data/hadith-chunks/meta.json", "utf8"));
          let bad = 0;
          o.cols.forEach((c, i) => {
            const d = n.cols[i];
            const same = d && d.k === c.k && d.start === c.start && d.count === c.count && d.hasBn === c.hasBn;
            if (!same) { bad++; console.error("বদলে গেছে:", JSON.stringify(c), "->", JSON.stringify(d)); }
          });
          console.log("পুরনো মোট", o.total, "| নতুন মোট", n.total);
          let md = "### হাদীস ডেটা বিল্ড\n\n| কিতাব | start | count | বাংলা |\n|---|---|---|---|\n";
          n.cols.forEach(c => { md += `| ${c.bn} | ${c.start} | ${c.count} | ${c.hasBn ? "আছে" : "নেই"} |\n`; });
          md += `\nমোট ${n.total} (আগে ${o.total}); পুরনো ${o.cols.length}টি কিতাবের start/count ${bad ? "বদলেছে ❌" : "অপরিবর্তিত ✅"}\n`;
          if (process.env.GITHUB_STEP_SUMMARY) fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, md);
          if (bad || n.cols.length < o.cols.length) process.exit(1);
          '

      - name: Commit and push
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add data/hadith-chunks
          git commit -m "হাদীস ডেটা: data/hadith-chunks পুনর্নির্মাণ (মুসনাদে আহমদসহ)" || { echo "No changes"; exit 0; }
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push
          # GITHUB_TOKEN-এর পুশ অন্য workflow চালু করে না, তাই APK বিল্ড নিজে চালু করি
          gh workflow run build-apk.yml --ref "${GITHUB_REF_NAME}" || echo "APK workflow চালু করা যায়নি; হাতে চালান"
