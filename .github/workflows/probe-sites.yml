# অস্থায়ী: muslimbangla-র হাদিস পেজের কাঠামো দেখা (কাজ শেষে মুছে ফেলা হবে)
name: probe-sites
on:
  push:
    branches: [probe/**]
    paths: ['.github/workflows/probe-sites.yml']
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Probe
        run: |
          UA="Mozilla/5.0 (compatible; DailyRuqyahResearch/1.0)"
          S=https://muslimbangla.com
          g() { curl -s -L -A "$UA" --max-time 40 "$@"; sleep 2; }
          strip() { python3 -c "
          import sys,re,html
          t=sys.stdin.read()
          t=re.sub(r'<script.*?</script>|<style.*?</style>','',t,flags=re.S)
          t=re.sub(r'<[^>]+>',' ',t); print(html.unescape(re.sub(r'\s+',' ',t)))"; }
          {
          echo "##### ALL BOOKS (text)"; g $S/hadith-books | strip | head -c 6000
          echo; echo "##### chapters page of book 16"; g $S/hadith-book/16/chapters -o /tmp/ch.html
          grep -o 'href="/hadith[^"]*"' /tmp/ch.html | sort -u | head -15
          echo "--- text"; strip < /tmp/ch.html | head -c 1200
          CH=$(grep -o 'href="/hadith-book/16/chapter[^"]*"' /tmp/ch.html | sed -n 2p | sed 's/href="//;s/"$//')
          echo; echo "##### chapter link chosen: $CH"
          g "$S$CH" -o /tmp/c1.html
          echo "--- links"; grep -o 'href="/hadith[^"]*"' /tmp/c1.html | sort -u | head -15
          echo "--- has __NEXT_DATA__: $(grep -c '__NEXT_DATA__' /tmp/c1.html)  self.__next_f: $(grep -c 'self.__next_f' /tmp/c1.html)"
          echo "--- text"; strip < /tmp/c1.html | head -c 3500
          echo; echo "--- raw hadith html sample"; grep -o '<[^>]*hadith[^>]*>' /tmp/c1.html | head -12
          } > probe-output.txt 2>&1
          git config user.name "probe-bot"; git config user.email "probe-bot@users.noreply.github.com"
          git add probe-output.txt && git commit -q -m "probe: ফলাফল ২" && git push
