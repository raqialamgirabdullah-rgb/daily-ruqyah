name: Build APK
on:
  push:
    branches: [main]
    paths-ignore: ["README.md"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - name: Prepare web files
        run: |
          mkdir www
          cp -r index.html app.js boot.js style.css sw.js manifest.webmanifest icons fonts data www/
      - name: Create Android project
        run: |
          npm init -y >/dev/null
          npm i @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
          npx cap add android
          npx cap sync android
      - name: Build debug APK
        run: cd android && chmod +x gradlew && ./gradlew assembleDebug --no-daemon
      - name: Publish APK to Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk Daily-Ruqyah.apk
          gh release delete latest --yes --cleanup-tag 2>/dev/null || true
          gh release create latest Daily-Ruqyah.apk --title "Daily Ruqyah APK" --notes "ডাউনলোড করে ফোনে ইনস্টল করুন।"
